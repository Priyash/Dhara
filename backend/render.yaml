services:
  - type: web
    name: dhara-api
    env: node
    region: singapore       # closest to India; also available: ohio, oregon, frankfurt
    plan: starter           # $7/mo — always-on, no cold starts
    # plan: free            # free tier works but has ~30s cold start on first request

    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      # All other secrets are set manually in the Render dashboard:
      # MONGODB_URI, FIREBASE_SERVICE_ACCOUNT_BASE64,
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
      # BUNNY_STREAM_LIBRARY_ID, BUNNY_STREAM_API_KEY,
      # BUNNY_CDN_PULL_ZONE, BUNNY_CDN_TOKEN_AUTH_KEY,
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
      # FRONTEND_URL  ← set to your Vercel URL after deploying frontend
      # ADMIN_EMAILS  ← comma-separated admin emails, e.g. admin@yourapp.com
      #                 REQUIRED — without this no one can access /admin in production
      # RESEND_API_KEY ← from resend.com dashboard → API Keys → Create API Key
      #                  Free tier: 3,000 emails/month, 100/day
      #                  Without this, creator/submission emails are skipped silently
      # RESEND_FROM   ← verified sender, e.g.  ধারা <noreply@yourdomain.com>
      #                  Domain must be verified in Resend dashboard → Domains
      # SENTRY_DSN     ← optional, from sentry.io project settings
      # ERROR_REPORTING_HOOK ← optional, set to ../integrations/sentryReporter.js
      #                  to send 5xx errors to Sentry once SENTRY_DSN is also set
      # REDIS_URL      ← optional, e.g. rediss://default:<password>@<host>:<port>
      #                  (Upstash Redis works well on Render — same region as this service)
      #                  Without this, response caching and rate limiting fall back to
      #                  in-memory storage, which only works correctly with ONE instance.
      #                  REQUIRED before scaling this service to 2+ instances.
