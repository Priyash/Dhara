name: Node.js CI

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Backend requires node >=20.0.0
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Point cache at the sub-package lockfiles, not the thin root stub
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          # Vite gracefully skips env file loading when these are absent,
          # but set VITE_API_URL so the build output is not empty for that var.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:4000' }}

      - name: Test backend
        run: npm test --prefix backend

      - name: Test frontend
        run: npm test --prefix frontend
