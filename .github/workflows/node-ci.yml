# ![Node.js CI](https://github.com/Priyash/Dhara/actions/workflows/node-ci.yml/badge.svg?branch=development)

name: Node.js CI

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Backend engines field requires node >=20.0.0 — 18.x excluded
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install all dependencies
        run: npm run install:all

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test
        run: npm test
